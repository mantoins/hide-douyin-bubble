name: Build Tweak
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          git clone https://github.com/theos/theos.git ~/theos
          echo "export THEOS=~/theos" >> ~/.bashrc
          source ~/.bashrc
          sudo apt update
          sudo apt install git make clang ldid -y
      - name: Compile
        run: |
          source ~/.bashrc
          make package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
