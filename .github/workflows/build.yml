name: Build Tweak
on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt update -y
          sudo apt install -y git make clang ldid dpkg-dev libplist-dev

      - name: Clone Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $THEOS

      - name: Build tweak
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-package
          path: packages/*.deb
